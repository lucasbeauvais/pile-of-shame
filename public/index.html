<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pile of Shame</title>
<meta name="description" content="Colle ton profil Steam et découvre à quel jeu de ta bibliothèque jouer ensuite, selon ton temps libre et tes goûts.">
<style>
:root{--bg:#0e1319;--panel:#161d26;--panel2:#1d2631;--line:#2a3644;--txt:#e6edf3;--mute:#8b98a5;--acc:#66c0f4;--acc2:#ff7a59;--ok:#5ec27a;--warn:#e3b341;--bad:#e5534b;--r:12px;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:14px;padding-block:14px;flex-wrap:wrap}
.logo{font-weight:800;font-size:20px;letter-spacing:-.02em}
.logo span{color:var(--acc2)}
.who{display:flex;align-items:center;gap:10px;margin-left:auto;color:var(--mute);font-size:14px}
.who img{width:32px;height:32px;border-radius:6px}
main{padding-block:24px 70px;display:flex;flex-direction:column;gap:22px}

.hero{padding-block:40px 10px;max-width:720px}
.hero h1{font-size:clamp(28px,5vw,44px);line-height:1.1;margin:0 0 12px;letter-spacing:-.03em;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--acc2)}
.hero p{color:var(--mute);margin:0 0 22px;max-width:60ch}
form.go{display:flex;gap:8px;flex-wrap:wrap}
form.go input{flex:1 1 300px;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;outline:none}
form.go input:focus{border-color:var(--acc)}
.hint{font-size:13px;color:var(--mute);margin-top:10px}
.hint code{background:var(--panel);padding:1px 6px;border-radius:4px;color:var(--txt)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:30px}
.steps div{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;font-size:14px;color:var(--mute)}
.steps b{display:block;color:var(--txt);margin-bottom:3px}

.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:650;white-space:nowrap}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#081521}
.btn.hot{background:var(--acc2);border-color:var(--acc2);color:#fff}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn.ghost{background:none}
.btn[disabled]{opacity:.5;cursor:wait}

.err{background:#2a1517;border:1px solid #5a2a2d;color:#ffb4ae;border-radius:10px;padding:12px 14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel h2{margin:0 0 4px;font-size:17px}
.sub{color:var(--mute);font-size:13px;margin:0 0 12px}

.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:120px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12px;color:var(--mute)}
.stat.shame b{color:var(--acc2)}
button.stat{text-align:left;cursor:pointer;color:inherit;font:inherit}
button.stat:hover{border-color:var(--acc)}
button.stat::after{content:"Voir →";display:block;font-size:11px;color:var(--acc);margin-top:2px}
.links{font-size:12px;display:flex;flex-wrap:wrap;gap:4px 10px}
.duel{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.duel .vs{align-self:center;font-weight:800;color:var(--acc2);font-size:18px}
.duel button.card{cursor:pointer;text-align:left;color:inherit;font:inherit;padding:0}
.duel button.card:hover{border-color:var(--acc)}
.duel .cbody{gap:5px;padding:10px}
.duel .title{font-size:15px}
.duel .streak{font-size:12px;color:var(--ok)}
.duel .pill{white-space:normal}
.dueltools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:13px;color:var(--mute)}
@media (max-width:520px){.duel{grid-template-columns:1fr 1fr}.duel .vs{display:none}.duel .pill{font-size:11px}}

.progress{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mute)}
.bar{flex:1;height:6px;background:var(--panel2);border-radius:99px;overflow:hidden}
.bar div{height:100%;background:var(--acc);transition:width .3s}

.ctrl{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.ctrl h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer;font-size:14px}
.seg button small{color:var(--mute);margin-left:4px}
.seg button.on{border-color:var(--acc);background:#1b3348}
.chk{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--mute);margin-top:10px;cursor:pointer}

.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{border:1px solid var(--line);background:var(--panel2);border-radius:99px;padding:5px 11px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;user-select:none}
.tag i{font-style:normal;width:28px;height:4px;border-radius:2px;background:var(--line);position:relative;overflow:hidden}
.tag i::after{content:"";position:absolute;inset:0;width:var(--w);background:var(--acc)}
.tag.like{border-color:var(--ok);background:#173023}
.tag.like::before{content:"♥";color:var(--ok)}
.tag.dislike{border-color:var(--bad);background:#2d1719;text-decoration:line-through;color:var(--mute)}
.tag.dislike::before{content:"✕";color:var(--bad);text-decoration:none}
.legend{font-size:12px;color:var(--mute);margin-top:8px}

.recos{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card.pick{border-color:var(--acc2);box-shadow:0 0 0 2px var(--acc2)}
.cover{width:100%;aspect-ratio:460/215;object-fit:cover;display:block;background:var(--panel2);max-width:100%}
.ph{aspect-ratio:460/215;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;background:linear-gradient(135deg,#2b4a6b,#5a3a6b)}
.cbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.rank{font-size:12px;color:var(--acc2);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.title{font-weight:750;font-size:17px;line-height:1.25}
.facts{display:flex;flex-wrap:wrap;gap:5px}
.pill{font-size:12px;border-radius:99px;padding:2px 8px;background:var(--panel2);color:var(--mute);white-space:nowrap}
.pill.good{color:var(--ok)}.pill.new{color:var(--acc2)}.pill.hot{color:var(--warn)}
.why{font-size:13px;color:var(--mute)}
.why b{color:var(--txt);font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:4px}

.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:120px 1fr auto;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.li img,.li .ph{width:120px;border-radius:6px;font-size:14px}
.li .nm{font-weight:600;min-width:0}
.li .nm small{display:block;color:var(--mute);font-weight:400;font-size:12px}
.li .acts{margin:0;padding:0}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.toolbar input,.toolbar select{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
.toolbar input{flex:1 1 200px}
details>summary{cursor:pointer;font-weight:700;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸ ";color:var(--mute)}
details[open]>summary::before{content:"▾ "}
.empty{color:var(--mute);text-align:center;padding:24px}
footer{color:var(--mute);font-size:12px;text-align:center;padding-block:10px 30px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,120px);background:var(--panel2);border:1px solid var(--acc);border-radius:10px;padding:10px 16px;transition:transform .25s;max-width:90vw;z-index:20}
#toast.show{transform:translate(-50%,0)}
.trends{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.trends .card .title{font-size:15px}
@media (max-width:860px){.trends{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.trends{grid-template-columns:1fr}}
@media (max-width:860px){.recos{grid-template-columns:1fr}.ctrl{grid-template-columns:1fr}.steps{grid-template-columns:1fr}}
@media (max-width:520px){.li{grid-template-columns:72px 1fr}.li img,.li .ph{width:72px}.li .acts{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap top"><div class="logo">Pile of <span>Shame</span></div><div class="who" id="who"></div></div></header>
<main class="wrap" id="app"></main>
<footer class="wrap">Données : API Steam (bibliothèque, joueurs connectés, classement), IGDB (temps pour finir) et SteamSpy (genres, avis). Tes choix (« déjà fini », « pas intéressé »…) restent dans ton navigateur. Pas affilié à Valve.</footer>
<div id="toast" role="status"></div>

<script>
/* ---------------- réglages ---------------- */
const TEMPS = {
  all:     { label: 'Peu importe' },
  soiree:  { label: 'Une soirée', hint: '< 5 h', lo: 0,  hi: 5 },
  soirees: { label: 'Quelques soirées', hint: '5–15 h', lo: 5, hi: 15 },
  gros:    { label: 'Un gros morceau', hint: '15–40 h', lo: 15, hi: 40 },
  monde:   { label: 'Un monde où vivre', hint: '40 h +', lo: 40, hi: 9999 },
};
const MODES = { all: 'Peu importe', solo: 'Solo', coop: 'Coop / à plusieurs' };
const COOP_TAGS = ['Co-op', 'Online Co-Op', 'Local Co-Op', 'Local Multiplayer', 'Split Screen'];
const NON_GAME = new Set(['Utilities', 'Software', 'Design & Illustration', 'Video Production', 'Audio Production', 'Animation & Modeling', 'Web Publishing', 'Photo Editing', 'Game Development', 'Software Training', 'Benchmark']);
const GENERIC = new Set(['Singleplayer', 'Multiplayer', 'Great Soundtrack', 'Early Access', 'Free to Play', 'Controller', 'Full controller support', 'Indie', 'Casual', 'Atmospheric', 'Beautiful', 'Classic', 'Masterpiece', 'Addictive', 'Fun', 'Good Soundtrack', 'Steam Achievements']);
const STARTED_MAX = 120; // minutes : en dessous, un jeu compte comme « à peine commencé »
const LIVE_MAX = 60;      // jeux dont on demande le nombre de joueurs connectés
const LIVE_MIN = 300;     // joueurs connectés à partir desquels un jeu « a du monde »
const SPIKE = 1.5;        // joueurs actuels / pic habituel à partir duquel on parle de pic

/* ---------------- utilitaires ---------------- */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || 'null'); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2600); }
function fmtN(n) { return n >= 10000 ? Math.round(n / 1000).toLocaleString('fr') + ' k' : n.toLocaleString('fr'); }
function fmtH(min) { if (!min) return '0 h'; const h = min / 60; return h < 10 ? h.toFixed(1).replace('.', ',') + ' h' : Math.round(h) + ' h'; }
function initials(n) { return esc((n || '?').split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase()); }
function cover(g) {
  return `<img class="cover" loading="lazy" alt="" src="https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/${g.appid}/header.jpg" data-fb="https://cdn.cloudflare.steamstatic.com/steam/apps/${g.appid}/header.jpg" data-ini="${initials(g.name)}" onerror="imgErr(this)">`;
}
function imgErr(i) { if (i.dataset.fb) { const f = i.dataset.fb; i.dataset.fb = ''; i.src = f; } else { const d = document.createElement('div'); d.className = 'ph'; d.textContent = i.dataset.ini; i.replaceWith(d); } }

/* ---------------- état ---------------- */
const S = {
  profile: null, games: [], meta: store('pos.meta') || {}, ttb: store('pos.ttb') || {},
  status: {}, prefs: { like: [], dislike: [] },
  temps: 'all', mode: 'all', started: true, played: false,
  hidden: new Set(), picks: [],
  loading: false, error: null, enrich: { done: 0, total: 0, paused: false },
  q: '', sort: 'score', view: 'reco',
  duel: {}, pair: null, streak: 0,
  live: { players: {}, chart: {}, asked: new Set(), busy: false },
};
function userKey() { return 'pos.u.' + S.profile.steamid; }
function saveUser() { store(userKey(), { status: S.status, prefs: S.prefs, temps: S.temps, mode: S.mode, started: S.started, played: S.played, duel: S.duel }); }
let metaSaveT;
function saveMeta() { clearTimeout(metaSaveT); metaSaveT = setTimeout(() => { store('pos.meta', S.meta); store('pos.ttb', S.ttb); }, 400); }

/* ---------------- moteur de reco ---------------- */
// Durée d'un jeu en minutes : temps pour finir d'IGDB (histoire « normale », sinon rapide, sinon complet), à défaut temps médian SteamSpy.
function durOf(id) {
  const t = S.ttb[id];
  const igdb = t && (t.n || t.h || t.c);
  if (igdb) return { min: igdb, src: 'igdb' };
  const m = S.meta[id];
  return m?.median ? { min: m.median, src: 'spy' } : null;
}
function isCoop(m) { return !!m?.tags?.some((t) => COOP_TAGS.includes(t)); }
function isMultiOnly(m) {
  if (!m?.tags?.length) return false;
  if (m.tags.includes('Massively Multiplayer')) return true;
  const top = m.tags.slice(0, 5);
  return (top.includes('PvP') || top.includes('Multiplayer') || top.includes('Battle Royale')) && !m.tags.includes('Singleplayer');
}
function isNonGame(m) { return !!m?.tags?.slice(0, 5).some((t) => NON_GAME.has(t)); }

function affinity() {
  const w = {};
  for (const g of S.games) {
    if (g.playtime < STARTED_MAX) continue;
    const m = S.meta[g.appid];
    if (!m?.tags) continue;
    const h = Math.log1p(g.playtime / 60);
    m.tags.slice(0, 10).forEach((t, i) => { if (!GENERIC.has(t) && !NON_GAME.has(t)) w[t] = (w[t] || 0) + h * (1 - i * 0.07); });
  }
  const max = Math.max(0, ...Object.values(w));
  if (max) for (const k in w) w[k] /= max;
  return w;
}

function durationFit(h) {
  const t = TEMPS[S.temps];
  if (!t.hi) return 1;
  if (h == null) return 0.45;
  if (h >= t.lo && h <= t.hi) return 1;
  const d = h < t.lo ? Math.log((t.lo || 1) / Math.max(h, 0.2)) : Math.log(h / t.hi);
  return Math.max(0, 1 - d / 1.1);
}

function quality(m) { if (!m) return 0.6; return (m.pos + 7.5) / (m.pos + m.neg + 10); }

function evaluate(g, aff) {
  const m = S.meta[g.appid];
  const st = S.status[g.appid];
  if (st === 'done' || st === 'skip') return null;
  if (S.hidden.has(g.appid)) return null;
  const going = st === 'playing' || g.playtime >= STARTED_MAX;
  if (going ? !S.played : !S.started && g.playtime > 0) return null;
  if (m && isNonGame(m)) return null;
  if (S.mode === 'coop' && !isCoop(m)) return null;
  if (S.mode === 'solo' && isMultiOnly(m)) return null;

  let pref = 0; const hits = []; let blocked = false;
  (m?.tags || []).slice(0, 10).forEach((t, i) => {
    const rw = 1 - i * 0.06;
    if (S.prefs.dislike.includes(t)) { if (i < 5) blocked = true; pref -= 1.5 * rw; }
    else if (S.prefs.like.includes(t)) { pref += 1 * rw; hits.push(t); }
    else if (aff[t] && !GENERIC.has(t)) { pref += 0.55 * aff[t] * rw; if (aff[t] > 0.35) hits.push(t); }
  });
  if (blocked) return null;
  const P = m?.tags?.length ? (Math.max(-1, Math.min(1, pref / 2.5)) + 1) / 2 : 0.4;
  const Q = quality(m);
  const dm = durOf(g.appid);
  const h = dm ? dm.min / 60 : null;
  // Jeu déjà entamé : ce qui compte pour ton créneau, c'est le temps qu'il te reste.
  const left = h != null && g.playtime ? h - g.playtime / 60 : h;
  const D = durationFit(left != null && left > 0 ? left : g.playtime ? null : h);
  if (TEMPS[S.temps].hi && D === 0) return null;
  const fresh = g.playtime === 0 ? 1 : 0.85;
  const duel = 1 + 0.3 * Math.tanh((S.duel[g.appid]?.r || 0) / 100); // tes duels : jusqu'à ±30 %
  const score = (TEMPS[S.temps].hi ? 0.45 * P + 0.22 * Q + 0.33 * D : 0.62 * P + 0.38 * Q) * fresh * duel;
  return { g, m, score, hits: [...new Set(hits)].slice(0, 3), h, Q, going, left };
}

function ranked() {
  const aff = affinity();
  return S.games.map((g) => evaluate(g, aff)).filter(Boolean).sort((a, b) => b.score - a.score);
}

// Ce qui bouge dans la bibliothèque : beaucoup de joueurs, un pic par rapport à d'habitude, ou une remontée dans le top Steam.
function liveOf(id) {
  const players = S.live.players[id] ?? null;
  const c = S.live.chart[id] || null;
  const base = S.meta[id]?.ccu || 0;
  const spike = players != null && base >= 50 ? players / base : null;
  const climb = c ? (c.lastWeekRank ? c.lastWeekRank - c.rank : 100 - c.rank) : 0;
  return { players, rank: c?.rank || 0, newEntry: !!c && !c.lastWeekRank, climb, spike };
}
// Les tendances partent des mêmes candidats que les recos : créneau, solo / coop, cases à cocher et tags ✕ s'appliquent.
function trending() {
  const out = [];
  for (const r of lastRanked) {
    const l = liveOf(r.g.appid);
    const busy = (l.players ?? 0) >= LIVE_MIN;
    const spiking = l.spike != null && l.spike >= SPIKE && (l.players ?? 0) >= 100;
    const rising = l.rank && l.climb >= 5;
    if (!busy && !spiking && !rising) continue;
    const heat = Math.log10(1 + (l.players ?? (l.rank ? 5000 : 0)))
      + (spiking ? Math.min(l.spike, 5) : 0)
      + (rising ? Math.min(l.climb, 50) / 10 : 0);
    out.push({ g: r.g, m: r.m, l, heat });
  }
  return out.sort((a, b) => b.heat - a.heat);
}

/* ---------------- réseau ---------------- */
async function analyze(input) {
  S.loading = true; S.error = null; render();
  try {
    const r = await fetch('/api/profile?u=' + encodeURIComponent(input));
    const d = await r.json().catch(() => ({ message: 'Réponse inattendue du serveur.' }));
    if (!r.ok) { S.error = d.message || 'Impossible de charger ce profil.'; return; }
    S.profile = d; S.games = d.games;
    const u = store(userKey()) || {};
    S.status = u.status || {}; S.prefs = u.prefs || { like: [], dislike: [] };
    S.temps = u.temps || 'all'; S.mode = u.mode || 'all'; S.started = u.started ?? true; S.played = u.played ?? false; S.duel = u.duel || {}; S.pair = null; S.view = 'reco';
    S.hidden = new Set(); S.picks = [];
    S.live = { players: {}, chart: {}, asked: new Set(), busy: false };
    store('pos.last', input);
    const url = new URL(location.href); url.searchParams.set('u', input); history.replaceState(null, '', url);
    enrich();
  } catch (e) {
    S.error = 'Connexion impossible. Vérifie ta connexion internet et réessaie.';
  } finally { S.loading = false; render(); }
}

let enrichRun = 0;
async function enrich() {
  const run = ++enrichRun;
  const played = S.games.filter((g) => g.playtime >= STARTED_MAX).sort((a, b) => b.playtime - a.playtime).slice(0, 40);
  const backlog = S.games.filter((g) => g.playtime < STARTED_MAX);
  const order = [...played.slice(0, 15), ...backlog, ...played.slice(15)];
  const queue = order.map((g) => g.appid).filter((id) => !S.meta[id]);
  S.enrich = { done: 0, total: queue.length, paused: false };
  renderProgress();
  loadChart();
  loadTtb(run);
  for (let i = 0; i < queue.length; i += 10) {
    if (run !== enrichRun) return;
    const ids = queue.slice(i, i + 10);
    try {
      const r = await fetch('/api/meta?ids=' + ids.join(','));
      if (!r.ok) throw new Error();
      const d = await r.json();
      for (const id of ids) { const m = d.meta?.[id]; if (m) S.meta[id] = m; }
      saveMeta();
    } catch (e) {
      S.enrich.paused = true; renderProgress(); renderResults(); return;
    }
    S.enrich.done = Math.min(queue.length, i + ids.length);
    renderProgress(); renderResults();
  }
  if (run === enrichRun) renderResults();
}

// Temps pour finir (IGDB) pour toute la bibliothèque, par lots de 50. Un jeu inconnu d'IGDB est redemandé au bout de 7 jours.
async function loadTtb(run) {
  const stale = Date.now() - 7 * 864e5;
  const ids = S.games.map((g) => g.appid).filter((id) => { const t = S.ttb[id]; return !t || (!t.n && !t.h && !t.c && t.t < stale); });
  for (let i = 0; i < ids.length; i += 50) {
    if (run !== enrichRun) return;
    const batch = ids.slice(i, i + 50);
    try {
      const r = await fetch('/api/ttb?ids=' + batch.join(','));
      if (!r.ok) return;
      const d = await r.json();
      if (d.status !== 'ok') return; // IGDB pas configuré sur le serveur : on garde SteamSpy
      const now = Date.now();
      for (const id of batch) { const t = d.ttb?.[id]; S.ttb[id] = t ? { n: t.normally, h: t.hastily, c: t.completely, t: now } : { t: now }; }
      saveMeta(); renderResults();
    } catch (e) { return; }
    await new Promise((res) => setTimeout(res, 300)); // IGDB : 4 requêtes par seconde au plus
  }
}

async function loadChart() {
  try {
    const r = await fetch('/api/charts');
    if (!r.ok) return;
    const d = await r.json();
    const owned = new Set(S.games.map((g) => g.appid));
    S.live.chart = {};
    for (const c of d.ranks || []) if (owned.has(c.appid)) S.live.chart[c.appid] = c;
    renderTrends();
  } catch (e) { /* le classement est un bonus : sans lui, on se contente des joueurs connectés */ }
}

// Joueurs connectés pour les candidats du moment : ceux du top Steam et les 40 meilleures recos selon tes critères.
// Rappelée quand les critères changent : seuls les jeux jamais demandés partent au serveur.
async function loadLive(run) {
  if (S.live.busy) return;
  const ids = [...new Set([
    ...lastRanked.filter((r) => S.live.chart[r.g.appid]).map((r) => r.g.appid),
    ...lastRanked.slice(0, 40).map((r) => r.g.appid),
  ])].filter((id) => !S.live.asked.has(id)).slice(0, LIVE_MAX);
  if (!ids.length) return;
  S.live.busy = true; renderTrends();
  for (let i = 0; i < ids.length; i += 15) {
    if (run !== enrichRun) { S.live.busy = false; return; }
    const batch = ids.slice(i, i + 15);
    batch.forEach((id) => S.live.asked.add(id));
    try {
      const r = await fetch('/api/players?ids=' + batch.join(','));
      if (!r.ok) throw new Error();
      const d = await r.json();
      for (const [id, n] of Object.entries(d.players || {})) if (n != null) S.live.players[id] = n;
    } catch (e) { break; }
  }
  S.live.busy = false; renderResults();
}

function renderProgress() {
  const el = $('#progress'); if (!el) return;
  const { done, total, paused } = S.enrich;

  el.innerHTML = paused
    ? `<div class="err">L'analyse des jeux s'est interrompue (${done}/${total}). Les recos se basent sur ce qui est déjà analysé. <button class="btn sm" data-act="resume">Reprendre</button></div>`
    : `<div class="progress"><span>Analyse des genres et durées : ${done}/${total}</span><div class="bar"><div style="width:${total ? done / total * 100 : 0}%"></div></div></div>`;

function renderTags() {
  const el = $('#tags'); if (!el) return;
  const aff = affinity();
  const backlogCount = {};
  for (const g of S.games) { if (g.playtime >= STARTED_MAX) continue; (S.meta[g.appid]?.tags || []).slice(0, 6).forEach((t) => { if (!GENERIC.has(t) && !NON_GAME.has(t)) backlogCount[t] = (backlogCount[t] || 0) + 1; }); }
  const fromAff = Object.entries(aff).sort((a, b) => b[1] - a[1]).slice(0, 14).map(([t]) => t);
  const fromBacklog = Object.entries(backlogCount).sort((a, b) => b[1] - a[1]).map(([t]) => t).filter((t) => !fromAff.includes(t)).slice(0, 8);
  const all = [...new Set([...S.prefs.like, ...S.prefs.dislike, ...fromAff, ...fromBacklog])];
  if (!all.length) { el.innerHTML = '<span class="sub" style="margin:0">Les tags apparaissent au fil de l\'analyse…</span>'; return; }
  el.innerHTML = all.map((t) => {
    const cls = S.prefs.like.includes(t) ? 'like' : S.prefs.dislike.includes(t) ? 'dislike' : '';
    const w = Math.round((aff[t] || 0) * 100);
    return `<span class="tag ${cls}" data-act="tag" data-v="${esc(t)}" role="button" tabindex="0">${esc(t)}${!cls && w ? `<i style="--w:${w}%" title="Affinité ${w} %"></i>` : ''}</span>`;
  }).join('');
}

// Durée du jeu (temps médian des joueurs, SteamSpy) et ton temps de jeu (Steam), avec ta progression quand on connaît les deux.
function timeInfo(g) {
  const d = durOf(g.appid);
  const dur = !d ? 'Durée inconnue' : d.src === 'igdb' ? `≈ ${fmtH(d.min)} pour le finir` : `≈ ${fmtH(d.min)} (temps médian des joueurs)`;
  if (!g.playtime) return { dur, mine: null };
  const pct = d ? Math.round(g.playtime / d.min * 100) : null;
  const mine = `Tu y as joué ${fmtH(g.playtime)}` + (pct == null ? '' : pct >= 100 ? ' (au-delà de la moyenne)' : ` (≈ ${pct} %)`);
  return { dur, mine };
}
function timePills(g) {
  const t = timeInfo(g);
  return `<span class="pill">${t.dur}</span>` + (t.mine ? `<span class="pill">${t.mine}</span>` : '<span class="pill new">Jamais lancé</span>');
}

function factsHTML(r) {
  const f = [];
  f.push(timePills(r.g));
  if (r.m && r.m.pos + r.m.neg >= 20) { const p = Math.round(r.m.pos / (r.m.pos + r.m.neg) * 100); f.push(`<span class="pill ${p >= 85 ? 'good' : ''}">${p} % d'avis positifs</span>`); }
  if (isCoop(r.m)) f.push('<span class="pill">Coop</span>');
  const l = liveOf(r.g.appid);
  if (l.players >= LIVE_MIN) f.push(`<span class="pill hot">${fmtN(l.players)} joueurs en ce moment</span>`);
  return `<div class="facts">${f.join('')}</div>`;
}
function whyHTML(r) {
  const parts = [];
  if (r.hits.length) parts.push(`Dans tes cordes : <b>${r.hits.map(esc).join(', ')}</b>`);
  else if (r.m?.tags?.length) parts.push(`Genre : ${r.m.tags.filter((t) => !GENERIC.has(t)).slice(0, 3).map(esc).join(', ')}`);
  if (r.going) parts.push(`<b>Tu y joues déjà</b>${r.left > 0 ? `, il te reste ≈ ${fmtH(r.left * 60)}` : ''}`);
  if (S.temps !== 'all' && r.h != null && !r.going && durationFit(r.h) === 1) parts.push(`colle à ton créneau « ${TEMPS[S.temps].label.toLowerCase()} »`);
  return parts.length ? `<div class="why">${parts.join(' · ')}</div>` : '';
}

function pileRows() {
  if (S.view === 'reco') return lastRanked;
  const byId = new Map(lastRanked.map((r) => [r.g.appid, r]));
  const keep = {
    all: () => true,
    never: (g) => !g.playtime,
    done: (g) => S.status[g.appid] === 'done',
    skip: (g) => S.status[g.appid] === 'skip',
    playing: (g) => S.status[g.appid] === 'playing',
  }[S.view];
  return S.games.filter(keep).map((g) => byId.get(g.appid) || (({ min } = durOf(g.appid) || {}) => ({ g, m: S.meta[g.appid], h: min ? min / 60 : null, hits: [], score: 0 }))());
}
function rowActsHTML(r) {
  const id = r.g.appid; const st = S.status[id];
  if (st === 'done') return `<div class="acts"><button class="btn sm" data-act="unmark" data-id="${id}">Pas fini finalement</button></div>`;
  if (st === 'skip') return `<div class="acts"><button class="btn sm" data-act="unmark" data-id="${id}">Finalement, ça m'intéresse</button></div>`;
  if (st === 'playing') return `<div class="acts"><button class="btn sm" data-act="unmark" data-id="${id}">Plus en cours</button><button class="btn sm" data-act="done" data-id="${id}">Déjà fini</button></div>`;
  const canPick = lastRanked.some((x) => x.g.appid === id);
  return actsHTML(id, true).replace('<div class="acts">', '<div class="acts">' + (canPick ? `<button class="btn sm" data-act="pickthis" data-id="${id}">Choisir</button>` : ''));
}
function renderPileList() {
  let l = pileRows().filter((r) => !S.q || r.g.name.toLowerCase().includes(S.q));
  if (S.sort === 'short') l = [...l].sort((a, b) => (a.h ?? 999) - (b.h ?? 999));
  if (S.sort === 'name') l = [...l].sort((a, b) => a.g.name.localeCompare(b.g.name, 'fr'));
  if (S.sort === 'hours') l = [...l].sort((a, b) => b.g.playtime - a.g.playtime);
  if (S.sort === 'duel') l = [...l].sort((a, b) => (S.duel[b.g.appid]?.r || 0) - (S.duel[a.g.appid]?.r || 0) || b.score - a.score);
  if (S.sort === 'score' && S.view !== 'reco') l = [...l].sort((a, b) => b.score - a.score || b.g.playtime - a.g.playtime);
  $('#pcount').textContent = `${l.length} jeu${l.length > 1 ? 'x' : ''}`;
  const shown = l.slice(0, 200);
  $('#plist').innerHTML = shown.length ? shown.map((r) => {
    const d = S.duel[r.g.appid];
    const st = { done: 'Fini', skip: 'Écarté', playing: 'En cours' }[S.status[r.g.appid]];
    return `<div class="li">${cover(r.g)}<div class="nm">${esc(r.g.name)}<small>${(({ dur, mine }) => dur + ' · ' + (mine || 'Jamais lancé'))(timeInfo(r.g))}${st ? ' · ' + st : ''}${d?.n ? ` · ⚔️ ${d.r > 0 ? '+' : ''}${Math.round(d.r)}` : ''}${r.hits.length ? ' · ' + r.hits.map(esc).join(', ') : ''}</small>${linksHTML(r.g)}</div>${rowActsHTML(r)}</div>`;
  }).join('')
    + (l.length > 200 ? `<p class="sub" style="margin-top:10px">${l.length - 200} autres jeux. Affine ta recherche pour les voir.</p>` : '')
    : '<p class="empty">Aucun jeu ici.</p>';
}

/* ---------------- versus ---------------- */
// Le gagnant reste en lice (3 victoires d'affilée au plus), l'adversaire est pris parmi les meilleures recos les moins souvent vues.
function duelPool() { return lastRanked.slice(0, 30).map((r) => r.g.appid); }
function nextChallenger(exclude) {
  const pool = duelPool().filter((id) => !exclude.includes(id));
  if (!pool.length) return null;
  const n = (id) => S.duel[id]?.n || 0;
  const min = Math.min(...pool.map(n));
  const least = pool.filter((id) => n(id) === min);
  return least[Math.floor(Math.random() * least.length)];
}
function ensurePair() {
  const pool = duelPool();
  if (pool.length < 2) { S.pair = null; return; }
  let [a, b] = S.pair || [];
  if (!pool.includes(a)) { a = nextChallenger([b]); S.streak = 0; }
  if (!pool.includes(b) || b === a) b = nextChallenger([a]);
  S.pair = a && b ? [a, b] : null;
}
function elo(win, lose) {
  const W = S.duel[win] || { r: 0, n: 0 }; const L = S.duel[lose] || { r: 0, n: 0 };
  const e = 1 / (1 + 10 ** ((L.r - W.r) / 400));
  const k = 32 * (1 - e);
  S.duel[win] = { r: W.r + k, n: W.n + 1 }; S.duel[lose] = { r: L.r - k, n: L.n + 1 };
}
function renderDuel() {
  const el = $('#duel'); if (!el) return;
  ensurePair();
  if (!S.pair) { el.innerHTML = '<p class="empty">Il faut au moins deux jeux dans tes recos pour lancer un duel.</p>'; return; }
  const card = (id) => {
    const g = S.games.find((x) => x.appid === id);
    return `<button class="card" data-act="vote" data-id="${id}" aria-label="Je préfère ${esc(g.name)}">${cover(g)}<div class="cbody">
      <div class="title">${esc(g.name)}</div><div class="facts">${timePills(g)}</div>
      ${id === S.pair[0] && S.streak ? `<div class="streak">🏆 ${S.streak} victoire${S.streak > 1 ? 's' : ''} d'affilée</div>` : ''}</div></button>`;
  };
  const played = Object.values(S.duel).reduce((a, d) => a + d.n, 0) / 2;
  el.innerHTML = `<div class="duel">${card(S.pair[0])}<div class="vs">VS</div>${card(S.pair[1])}</div>
    <div class="dueltools"><button class="btn sm" data-act="vote" data-id="0">Aucun des deux</button><button class="btn sm ghost" data-act="duelskip">Passer</button>
    <span>${Math.round(played)} duel${played >= 2 ? 's' : ''} joué${played >= 2 ? 's' : ''}</span>${played ? '<button class="btn sm ghost" data-act="duelreset">Remettre à zéro</button>' : ''}</div>`;
}

/* ---------------- actions ---------------- */
function setStatus(id, s, msg) { S.status[id] = s; S.picks = S.picks.filter((x) => x !== id); saveUser(); toast(msg); renderResults(); }
// Tire n jeux différents parmi les 15 meilleurs, au hasard mais en favorisant les mieux notés.
function weightedPicks(list, n) {
  const pool = list.slice(0, 15); const out = [];
  while (out.length < n && pool.length) {
    const w = pool.map((r) => r.score ** 3); let x = Math.random() * w.reduce((a, b) => a + b, 0);
    let i = 0; while (i < pool.length - 1 && (x -= w[i]) > 0) i++;
    out.push(pool.splice(i, 1)[0]);
  }
  return out;
}

// Amène « À jouer ensuite » en haut de l'écran, bouton 🎲 compris, seulement si ce n'est pas déjà visible.
function showNext() { const el = $('#next'); if (!el) return; const top = el.getBoundingClientRect().top; if (top < 0 || top > innerHeight * 0.6) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }

const ACTIONS = {
  change: () => { enrichRun++; S.profile = null; S.games = []; S.error = null; history.replaceState(null, '', location.pathname); render(); },
  temps: (t) => { S.temps = t.dataset.v; S.picks = []; saveUser(); render(); },
  mode: (t) => { S.mode = t.dataset.v; S.picks = []; saveUser(); render(); },
  tag: (t) => {
    const v = t.dataset.v; const p = S.prefs;
    if (p.like.includes(v)) { p.like = p.like.filter((x) => x !== v); p.dislike.push(v); }
    else if (p.dislike.includes(v)) { p.dislike = p.dislike.filter((x) => x !== v); }
    else p.like.push(v);
    S.picks = []; saveUser(); renderResults();
  },
  dice: () => {
    // Trois nouveaux jeux d'un coup ; on évite de reproposer ceux qui viennent d'être tirés quand il y a assez de choix.
    const fresh = lastRanked.filter((x) => !S.picks.includes(x.g.appid));
    const picks = weightedPicks(fresh.length >= 3 ? fresh : lastRanked, 3);
    if (!picks.length) { toast('Aucun jeu ne correspond à ces critères'); return; }
    S.picks = picks.map((r) => r.g.appid); renderResults(); showNext();
  },
  criteria: () => $('#criteres')?.scrollIntoView({ behavior: 'smooth', block: 'start' }),
  go: (t) => { const id = +t.dataset.id; const g = S.games.find((x) => x.appid === id); setStatus(id, 'playing', `Bon jeu sur ${g?.name || 'ce jeu'} ! Il sort des recos.`); },
  later: (t) => { const id = +t.dataset.id; S.hidden.add(id); S.picks = S.picks.filter((x) => x !== id); toast('Mis de côté pour ce soir'); renderResults(); },
  done: (t) => setStatus(+t.dataset.id, 'done', 'Bien joué ! Marqué comme fini.'),
  skip: (t) => setStatus(+t.dataset.id, 'skip', "C'est noté, on ne te le proposera plus."),
  pickthis: (t) => { S.picks = [+t.dataset.id]; renderResults(); showNext(); },
  resume: () => enrich(),
  pileview: (t) => {
    const v = t.dataset.v;
    S.view = v === 'hours' ? 'all' : v; S.sort = v === 'hours' ? 'hours' : v === 'all' || v === 'never' ? 'name' : 'score'; S.q = '';
    const d = $('#pile'); d.open = true; const pq = $('#pq'); if (pq) pq.value = '';
    renderPile(); d.scrollIntoView({ behavior: 'smooth', block: 'start' });
  },
  unmark: (t) => { const id = +t.dataset.id; delete S.status[id]; saveUser(); toast('C’est noté, le jeu revient dans ta pile.'); renderResults(); },
  vote: (t) => {
    const id = +t.dataset.id; const [a, b] = S.pair || [];
    if (!a) return;
    if (!id) { // aucun des deux : les deux reculent un peu, on change les deux
      for (const x of [a, b]) { const d = S.duel[x] || { r: 0, n: 0 }; S.duel[x] = { r: d.r - 16, n: d.n + 1 }; }
      S.pair = null; S.streak = 0;
      const c1 = nextChallenger([a, b]); const c2 = c1 && nextChallenger([a, b, c1]); if (c1 && c2) S.pair = [c1, c2];
    } else {
      const lose = id === a ? b : a;
      elo(id, lose);
      S.streak = id === a ? S.streak + 1 : 1;
      if (S.streak > 3) { S.streak = 0; const c1 = nextChallenger([a, b]); const c2 = c1 && nextChallenger([a, b, c1]); S.pair = c1 && c2 ? [c1, c2] : [id, nextChallenger([id, lose])]; }
      else S.pair = [id, nextChallenger([id, lose])];
    }
    saveUser(); renderResults();
  },
  duelskip: () => { const [a, b] = S.pair || []; const c1 = nextChallenger([a, b]); const c2 = c1 && nextChallenger([a, b, c1]); S.pair = c1 && c2 ? [c1, c2] : null; S.streak = 0; renderDuel(); },
  duelreset: () => { S.duel = {}; S.pair = null; S.streak = 0; saveUser(); toast('Duels remis à zéro'); renderResults(); },
};
document.addEventListener('click', (e) => { const t = e.target.closest('[data-act]'); if (!t || t.tagName === 'INPUT') return; const f = ACTIONS[t.dataset.act]; if (f) f(t, e); });
document.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.tag')) { e.preventDefault(); ACTIONS.tag(e.target); } });
document.addEventListener('change', (e) => {
  if (e.target.id === 'started') { S.started = e.target.checked; saveUser(); renderResults(); }
  if (e.target.id === 'played') { S.played = e.target.checked; S.picks = []; saveUser(); renderResults(); }
});
document.addEventListener('toggle', (e) => { if (e.target.id === 'pile' && e.target.open) renderPile(); }, true);

/* ---------------- démarrage ---------------- */
render();
const initial = new URLSearchParams(location.search).get('u');
if (initial) analyze(initial);
</script>
</body>
